<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Click Passport Photo Maker</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsPDF Library for PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Free Image Background Removal Library -->
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/imgly-background-removal.js"></script>
</head>
<body class="bg-gray-100 p-5">

  <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Instant Passport Size Photo Generator</h1>

    <!-- Upload Section -->
    <div class="mb-4">
      <label class="block font-semibold mb-2">1. Photo Upload Karein:</label>
      <input type="file" id="imageInput" accept="image/*" class="w-full border p-2 rounded">
    </div>

    <!-- Options Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block font-semibold mb-2">2. Kitni Photo Print Karni Hain?</label>
        <select id="photoCount" class="w-full border p-2 rounded">
          <option value="6">6 Photos</option>
          <option value="12">12 Photos</option>
          <option value="18">18 Photos</option>
          <option value="24">24 Photos</option>
          <option value="30">30 Photos</option>
          <option value="36">36 Photos</option>
          <option value="42">42 Photos</option>
          <option value="48">48 Photos</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold mb-2">3. Background Color Choose Karein:</label>
        <input type="color" id="bgColor" value="#ffffff" class="w-full h-10 border rounded cursor-pointer">
      </div>
    </div>

    <button id="processBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
      Generate A4 Sheet
    </button>

    <!-- Status Text -->
    <p id="status" class="text-center font-medium mt-3 text-gray-700"></p>

    <!-- Hidden Canvas for Processing -->
    <canvas id="a4Canvas" class="hidden"></canvas>

    <!-- Download Buttons -->
    <div id="downloadSection" class="hidden mt-6 flex gap-4">
      <button id="downloadJpg" class="w-1/2 bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">
        Download JPG
      </button>
      <button id="downloadPdf" class="w-1/2 bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700">
        Download PDF
      </button>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const processBtn = document.getElementById('processBtn');
    const photoCountSelect = document.getElementById('photoCount');
    const bgColorInput = document.getElementById('bgColor');
    const status = document.getElementById('status');
    const canvas = document.getElementById('a4Canvas');
    const ctx = canvas.getContext('2d');
    const downloadSection = document.getElementById('downloadSection');

    // A4 Sheet dimensions at 300 DPI (2480 x 3508 pixels)
    canvas.width = 2480;
    canvas.height = 3508;

    processBtn.addEventListener('click', async () => {
      if (!imageInput.files[0]) {
        alert("Kripya photo select karein!");
        return;
      }

      status.innerText = "Processing... Background remove aur enhancement ho raha hai...";
      processBtn.disabled = true;

      try {
        const file = imageInput.files[0];
        
        // 1. Background Removal
        const blob = await imglyRemoveBackground(file);
        const img = new Image();
        img.src = URL.createObjectURL(blob);

        img.onload = () => {
          // 2. Beauty & Enhancement Effects (Brightness/Contrast Adjust)
          const processedCanvas = document.createElement('canvas');
          const pCtx = processedCanvas.getContext('2d');
          
          // Standard Passport Size in pixels (approx 413 x 531 px at 300 DPI)
          const pWidth = 413;
          const pHeight = 531;
          processedCanvas.width = pWidth;
          processedCanvas.height = pHeight;

          // Apply Smoothness/Brightness Filter
          pCtx.filter = "brightness(108%) contrast(105%) saturate(105%)";
          
          // Fill Solid Background Color
          pCtx.fillStyle = bgColorInput.value;
          pCtx.fillRect(0, 0, pWidth, pHeight);

          // Draw Cutout Image
          pCtx.drawImage(img, 0, 0, pWidth, pHeight);

          // Add Border around single passport photo
          pCtx.strokeStyle = "#cccccc";
          pCtx.lineWidth = 4;
          pCtx.strokeRect(0, 0, pWidth, pHeight);

          // 3. Grid Layout on A4 Sheet
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height); // Clear A4 Canvas

          const totalPhotos = parseInt(photoCountSelect.value);
          const cols = 6; // 6 photos per row
          const marginX = 100;
          const marginY = 100;
          const gapX = 30;
          const gapY = 40;

          for (let i = 0; i < totalPhotos; i++) {
            const row = Math.floor(i / cols);
            const col = i % cols;

            const x = marginX + col * (pWidth + gapX);
            const y = marginY + row * (pHeight + gapY);

            ctx.drawImage(processedCanvas, x, y);
          }

          status.innerText = "Ready! Download button pr click karein.";
          downloadSection.classList.remove('hidden');
          processBtn.disabled = false;
        };

      } catch (error) {
        console.error(error);
        status.innerText = "Error: Photo process karne me dikkat aayi.";
        processBtn.disabled = false;
      }
    });

    // Download JPG
    document.getElementById('downloadJpg').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'passport_photos_a4.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });

    // Download PDF
    document.getElementById('downloadPdf').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
      pdf.save('passport_photos_a4.pdf');
    });
  </script>
</body>
</html>
